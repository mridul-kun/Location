<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Location</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
        <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
            <circle cx="12" cy="12" r="5" />
            <g stroke-width="2" stroke-linecap="round">
                <line x1="12" y1="1" x2="12" y2="4" />
                <line x1="12" y1="20" x2="12" y2="23" />
                <line x1="4.22" y1="4.22" x2="6.34" y2="6.34" />
                <line x1="17.66" y1="17.66" x2="19.78" y2="19.78" />
                <line x1="1" y1="12" x2="4" y2="12" />
                <line x1="20" y1="12" x2="23" y2="12" />
                <line x1="4.22" y1="19.78" x2="6.34" y2="17.66" />
                <line x1="17.66" y1="6.34" x2="19.78" y2="4.22" />
            </g>
        </svg>
        <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20"
            style="display:none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
    </button>

    <!-- Overlay UI -->
    <div class="overlay-panel">
        <form id="searchForm" class="search-box">
            <input type="text" id="searchInput" placeholder="Search Google Maps" autocomplete="off">
            <button type="submit" aria-label="Search">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path
                        d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z" />
                </svg>
            </button>
        </form>

        <div class="chip-row">
            <button class="chip">🍽 Restaurants</button>
            <button class="chip">🛏 Hotels</button>
            <button class="chip">📷 Things to do</button>
            <button class="chip">🏛 Museums</button>
            <button class="chip">🚌 Transit</button>
            <button class="chip">💊 Pharmacies</button>
        </div>
    </div>

    <div class="map-wrapper">
        <iframe id="mapFrame" src="https://www.google.com/maps/embed?pb=<iframe src="
            https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3506.343437306263!2d77.28450047528393!3d28.499313175737722!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390ce6d34850c18f%3A0x14fb9547118464ec!2s25%2C%20F%20Block%20Ln%2C%20Block%20F%2C%20Vishwakarma%20Colony%2C%20Pul%20Pehladpur%2C%20New%20Delhi%2C%20Delhi%20110044!5e0!3m2!1sen!2sin!4v1790511857173!5m2!1sen!2sin"
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>"
        style="border:0;"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>

    <script src="script.js"></script>
</body>

</html>
